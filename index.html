<!DOCTYPE html>

<html lang="uk"><head><meta charset="utf-8">

html,body{height:100%;margin:0}

</style></head><body>
<div id="bar">
<label>🌐 <select id="lg"><option value="uk">Українська</option><option value="en">English</option></select></label>

<b data-u="Склеїти:" data-e="Glue:">Склеїти:</b><span id="ch" style="display:flex;gap:6px"></span><select id="mode"><option value="seq" data-u="по черзі" data-e="one by one">по черзі</option><option value="all" data-u="разом" data-e="all at once">разом</option></select><button id="pl">▶</button><input id="tt" type="range" min="0" max="1" step="0.001" value="0" style="width:140px"><label><span data-u="Фігури" data-e="Fill">Фігури</span> <input id="pc" type="color" value="#f1efe8"></label><label><span data-u="Закруглення" data-e="Rounding">Закруглення</span> <input id="rr" type="range" min="0" max="30" value="12"></label><button id="bl" data-u="Розташувати" data-e="Arrange">Розташувати</button><button id="bf" data-u="Вписати" data-e="Fit">Вписати</button><label><span data-u="Сепаратриси" data-e="Separatrices">Сепаратриси</span> <select id="dh"><option value="1" data-u="штрихові" data-e="dashed">штрихові</option><option value="0" data-u="суцільні" data-e="solid">суцільні</option></select></label><b data-u="Операція:" data-e="Operation:">Операція:</b><select id="op"><option value="slide" data-u="ковзання" data-e="slide">ковзання</option><option value="c01" data-u="0-1 скорочення" data-e="0-1 cancellation">0-1 скорочення</option><option value="c12" data-u="1-2 скорочення" data-e="1-2 cancellation">1-2 скорочення</option><option value="b01" data-u="0-1 народження" data-e="0-1 birth">0-1 народження</option><option value="b12" data-u="1-2 народження" data-e="1-2 birth">1-2 народження</option></select><select id="sh"></select><select id="sd"><option value="L">← L</option><option value="R">R →</option></select><button id="sp">▶</button><input id="sl" type="range" min="0" max="1" step="0.001" value="0" style="width:110px"><button id="sa" title="Застосувати / Apply">✓</button><button id="at" data-u="Атом" data-e="Atom">Атом</button><button id="hd" data-u="Розклад на ручки" data-e="Handle decomposition">Розклад на ручки</button><button id="fl">Потік Морса</button><span style="opacity:.55">v1.0.0</span><button id="bs">SVG</button>
</div>
<div id="w"><svg id="s" viewBox="-300 -300 600 600"></svg></div>
<script>
const $=id=>document.getElementById(id),svg=$('s'),PI=Math.PI;
let P=[],E=[],drag=null;
const rad=p=>+$('L').value/(2*Math.sin(PI/p.m));
function parse(){
  let txt=$('code').value.trim(),sg='';
  const mm=txt.match(/(^|\s)00(\s|$)/); // після 00 — знаки стрічок: + (без перекрутки), - (перекручена)
  if(mm){sg=txt.slice(mm.index+mm[0].length).replace(/[−–]/g,'-').replace(/[^+-]/g,'');txt=txt.slice(0,mm.index);}
  const W=[[]];
  for(const x of txt.split(/\s+/).filter(Boolean).map(Number)){
    if(x===0)W.push([]);else if(!isNaN(x))W[W.length-1].push(x);
  }
  const ex=+$('ex').value;
  P=W.filter(w=>w.length).map(w=>({w,m:Math.max(3,2*w.length+ex),c:[0,0],rot:0,pos:w.map((_,i)=>2*i)}));
  TW={};[...new Set(W.flat())].filter(n=>n).sort((a,b)=>a-b).forEach((n,i)=>{if(sg[i]==='-')TW[n]=1;});
  const occ={};E=[];
  P.forEach(p=>p.w.forEach((n,i)=>{
    const o=occ[n]=occ[n]||[];o.push({p,s:p.pos[i],i});
    if(o.length%2===0)E.push({a:o[o.length-2],b:o[o.length-1],n,off:[0,0],ka:2*n,kb:2*n+1});
  }));
  const cnt={}; // висота слова: безпосередньо перед його найменшою півстрічкою (nA<nB), півстрічки впорядковані 1A<1B<2A<2B<…
  P.forEach(p=>{p.key=Math.min(...p.w.map(n=>{const h=cnt[n]||0;cnt[n]=h+1;return 2*n+h%2;}))-.5;});
  if(KEEP)applyKeep();else layout();
  chips();
}
let LG='uk';
const tr=(u,e)=>LG==='en'?e:u;
function flLabel(){$('fl').textContent=FL==2?tr('Обернений потік','Reversed flow'):tr('Потік Морса','Morse flow');}
function setLang(l){
  LG=l;document.documentElement.lang=l;
  document.querySelectorAll('[data-u]').forEach(el=>{el.textContent=l==='en'?el.dataset.e:el.dataset.u;});
  document.title=tr('Візуалізатор розгорток поверхонь','Surface unfolding visualizer');
  flLabel();
}
function setPos(p,pos){ // розташування чисел слова на сторонах багатокутника; оновлює кінці ребер
  p.pos=pos;
  E.forEach(e=>{if(e.a.p===p)e.a.s=pos[e.a.i];if(e.b.p===p)e.b.s=pos[e.b.i];});
}
function patterns(k,ex){ // способи розподілити вільні сторони між числами (проміжок між сусідніми числами ≥ 2)
  const out=[],seen={};
  for(let t=1;t<=Math.min(k,Math.max(1,ex));t++)for(let o=0;o<k;o++){
    const g=Array(k).fill(2),ids=[...new Set(Array.from({length:t},(_,i)=>(o+Math.round(i*k/t))%k))];
    for(let r=0,q=0;r<ex;r++,q=(q+1)%ids.length)g[ids[q]]++;
    const key=g.join(',');if(!seen[key]){seen[key]=1;out.push(g);}
  }
  return out;
}
// штраф: перетини кривих, проходження крізь чужі багатокутники, числа на зовнішньому боці (вільні сторони мають бути зверху)
function costLayout(){
  const pl=E.map(e=>polyOf(curve(e),12)),N=P.length;let c=0;
  for(let i=0;i<E.length;i++){
    for(let j=i+1;j<E.length;j++)c+=10*(crossN(pl[i][0],pl[j])+crossN(pl[i][1],pl[j]));
    pl[i].forEach((h,hi)=>h.forEach((v,k)=>{
      if(hi===0&&k<3||hi===1&&k>h.length-4)return; // біля власних кінців крива виходить із багатокутника
      if(P.some(q=>Math.hypot(v[0]-q.c[0],v[1]-q.c[1])<rad(q)*.9))c+=2;
    }));
  }
  P.forEach((p,i)=>{
    const f=2*PI*i/N;
    c+=.5*p.pos.reduce((s,ps)=>s+(1+Math.cos(p.rot+2*PI*ps/p.m-f))/2,0)/p.pos.length;
  });
  return c;
}
function optRot(ms){ // для кожного багатокутника підбираємо розподіл чисел і поворот (крок 15°) за мінімумом штрафу
  const base=P.map(p=>p.rot),N=24,t0=performance.now();
  for(let pass=0;pass<2;pass++)P.forEach((p,i)=>{
    let best=costLayout(),bp=p.pos,br=p.rot;
    for(const g of patterns(p.w.length,p.m-2*p.w.length)){
      const pos=[0];for(let j=1;j<g.length;j++)pos.push(pos[j-1]+g[j-1]);
      setPos(p,pos);
      for(let k=0;k<N;k++){
        if(performance.now()-t0>ms)break;
        p.rot=base[i]+2*PI*k/N;const c=costLayout();
        if(c<best-1e-9){best=c;bp=pos;br=p.rot;}
      }
    }
    setPos(p,bp);p.rot=br;
  });
}
function layout(ms=300){
  const N=P.length,d=+$('d').value;
  if(!N)return;
  const rmax=Math.max(...P.map(rad)),R=N>1?d*2*rmax/(2*Math.sin(PI/N)):0;
  P.forEach((p,i)=>{
    const f=2*PI*i/N,k=p.w.length;
    setPos(p,p.w.map((_,j)=>2*j));
    p.c=[R*Math.cos(f),-R*Math.sin(f)];
    p.rot=f+PI-(k-1)*2*PI/p.m; // числа симетрично навпроти зовнішнього напряму
  });
  E.forEach(e=>e.off=[0,0]);
  optRot(ms);
  fit();
}
function sp(p,s){
  const a=p.rot+2*PI*s/p.m,r=rad(p)*Math.cos(PI/p.m);
  return{x:p.c[0]+r*Math.cos(a),y:p.c[1]-r*Math.sin(a),nx:Math.cos(a),ny:-Math.sin(a)};
}
const bez=(q,t)=>{const u=1-t;return[0,1].map(i=>u*u*u*q[0][i]+3*u*u*t*q[1][i]+3*u*t*t*q[2][i]+t*t*t*q[3][i]);};
const bzd=(q,t)=>{const u=1-t;return[0,1].map(i=>3*(u*u*(q[1][i]-q[0][i])+2*u*t*(q[2][i]-q[1][i])+t*t*(q[3][i]-q[2][i])));};
const q2=v=>v[0].toFixed(1)+' '+v[1].toFixed(1);
function curveBase(e){
  const A=sp(e.a.p,e.a.s),B=sp(e.b.p,e.b.s),T=+$('T').value,loop=e.a.p===e.b.p,L=+$('L').value;
  let m0,c1,c2,u,h,piv=null;
  if(!loop){
    const D=Math.hypot(B.x-A.x,B.y-A.y),t=T*D,P1=[A.x+t*A.nx,A.y+t*A.ny],P2=[B.x+t*B.nx,B.y+t*B.ny];
    m0=[(A.x+3*P1[0]+3*P2[0]+B.x)/8,(A.y+3*P1[1]+3*P2[1]+B.y)/8];
    u=[B.x+P2[0]-P1[0]-A.x,B.y+P2[1]-P1[1]-A.y];
    const c=[(A.x+2*P1[0]+P2[0])/4,(A.y+2*P1[1]+P2[1])/4];
    h=Math.hypot(c[0]-m0[0],c[1]-m0[1]);
    c1=[A.x+t/2*A.nx,A.y+t/2*A.ny];c2=[B.x+t/2*B.nx,B.y+t/2*B.ny];
    piv=P.find(q=>Math.hypot(m0[0]-q.c[0],m0[1]-q.c[1])<rad(q)+L/2)||null; // вузол не може потрапити в багатокутник
  }
  if(loop||piv){ // петля або обхід багатокутника: вузол поза ним, дотична до вузла — по колу навколо нього
    const p=loop?e.a.p:piv,R=rad(p);
    let dx,dy;
    if(loop){dx=A.nx+B.nx;dy=A.ny+B.ny;}else{dx=m0[0]-p.c[0];dy=m0[1]-p.c[1];}
    let l=Math.hypot(dx,dy);
    if(l<1e-6){dx=-A.ny;dy=A.nx;l=1;}
    dx/=l;dy/=l;
    let r=R+L;
    if(loop){ // середина петлі на серединному перпендикулярі; відстань від круга 1.5R, а якщо між кінцями багато інших кінців — 3R чи 3.5R
      const mm=p.m,aA=p.rot+2*PI*e.a.s/mm,ad=Math.atan2(-dy,dx),wr=a=>((a+PI)%(2*PI)+2*PI)%(2*PI)-PI,half=Math.abs(wr(aA-ad));
      let cnt=0;
      E.forEach(q=>[q.a,q.b].forEach(o=>{if(o.p===p&&o!==e.a&&o!==e.b&&Math.abs(wr(p.rot+2*PI*o.s/mm-ad))<half)cnt++;}));
      r=R*(1+(cnt>4?3.5:cnt>2?3:1.5));
    }
    m0=[p.c[0]+dx*r,p.c[1]+dy*r];
    u=[-dy,dx];if(u[0]*(B.x-A.x)+u[1]*(B.y-A.y)<0)u=[dy,-dx];
    const dA=Math.hypot(m0[0]-A.x,m0[1]-A.y),dB=Math.hypot(m0[0]-B.x,m0[1]-B.y);
    h=.4*(dA+dB)/2;c1=[A.x+T*dA*A.nx,A.y+T*dA*A.ny];c2=[B.x+T*dB*B.nx,B.y+T*dB*B.ny];
  }
  const M=[m0[0]+e.off[0],m0[1]+e.off[1]],ul=Math.hypot(...u)||1;u=[u[0]/ul,u[1]/ul];
  const S1=[[A.x,A.y],c1,[M[0]-h*u[0],M[1]-h*u[1]],M],S2=[M,[M[0]+h*u[0],M[1]+h*u[1]],c2,[B.x,B.y]];
  return{M,S1,S2,d:`M${q2(S1[0])}C${q2(S1[1])},${q2(S1[2])},${q2(S1[3])}C${q2(S2[1])},${q2(S2[2])},${q2(S2[3])}`};
}
// ---- ковзання ручки (handle slide) ----
function curve(e){ // кінець, що рухається (ковзання, скорочення): сідло трохи тягнеться за ним, лишається гладким і не наближається до нерухомих кругів
  const base=curveBase(e),fa=FEET&&FEET.get(e.a),fb=FEET&&FEET.get(e.b),sl=SLIDE&&SLIDE.e===e;
  if(!fa&&!fb&&!sl)return base;
  const A0=sp(e.a.p,e.a.s),B0=sp(e.b.p,e.b.s);
  let A=A0,B=B0;
  if(sl){if(SLIDE.h)B=SLIDE.foot;else A=SLIDE.foot;}
  if(fa)A=fa;if(fb)B=fb;
  const T=+$('T').value,dA=[A.x-A0.x,A.y-A0.y],dB=[B.x-B0.x,B.y-B0.y],nm=((A!==A0)+(B!==B0))||1;
  const w=Math.min(1,Math.max(Math.hypot(...dA),Math.hypot(...dB))/30);
  let M=[base.M[0]+.1*(dA[0]+dB[0])/nm,base.M[1]+.1*(dA[1]+dB[1])/nm];
  P.forEach(q=>{ // відстань до нерухомого круга не меншає
    if(DISP&&DISP.has(q))return;
    const d0=Math.hypot(base.M[0]-q.c[0],base.M[1]-q.c[1]),d1=Math.hypot(M[0]-q.c[0],M[1]-q.c[1]);
    if(d0>=rad(q)*.98&&d1<d0&&d1>1e-6)M=[q.c[0]+(M[0]-q.c[0])/d1*d0,q.c[1]+(M[1]-q.c[1])/d1*d0];
  });
  const u0=nz(base.S1[2],base.S2[1]),uc=nz([A.x,A.y],[B.x,B.y]);
  let u=[u0[0]*(1-w)+uc[0]*w,u0[1]*(1-w)+uc[1]*w];const ul=Math.hypot(...u)||1;u=[u[0]/ul,u[1]/ul];
  const dAm=Math.hypot(M[0]-A.x,M[1]-A.y),dBm=Math.hypot(M[0]-B.x,M[1]-B.y),ln=(a,b)=>Math.hypot(a[0]-b[0],a[1]-b[1]);
  const lA=ln(base.S1[1],base.S1[0])*(1-w)+w*T*dAm,lB=ln(base.S2[2],base.S2[3])*(1-w)+w*T*dBm;
  const h=ln(base.S1[3],base.S1[2])*(1-w)+w*.4*(dAm+dBm)/2;
  const S1=[[A.x,A.y],[A.x+A.nx*lA,A.y+A.ny*lA],[M[0]-h*u[0],M[1]-h*u[1]],M],S2=[M,[M[0]+h*u[0],M[1]+h*u[1]],[B.x+B.nx*lB,B.y+B.ny*lB],[B.x,B.y]];
  return{M,S1,S2,d:`M${q2(S1[0])}C${q2(S1[1])},${q2(S1[2])},${q2(S1[3])}C${q2(S2[1])},${q2(S2[2])},${q2(S2[3])}`};
}
function fillSlide(){
  const o=[];E.forEach((e,i)=>{o.push([e.n,0,i],[e.n,1,i]);});
  o.sort((a,b)=>a[0]-b[0]||a[2]-b[2]||a[1]-b[1]);
  $('sh').innerHTML='<option value="">—</option>'+o.map(([n,h,i])=>`<option value="${i}:${h}">${n}${h?'B':'A'}</option>`).join('');
  $('sl').value=0;
}
const quad=(a,c,b,n)=>Array.from({length:n+1},(_,i)=>{const u=i/n,v=1-u;return[v*v*a[0]+2*u*v*c[0]+u*u*b[0],v*v*a[1]+2*u*v*c[1]+u*u*b[1]];});
function slidePlan(pr){
  const sel=$('sh').value;if(!sel)return null;
  const [ei,hh]=sel.split(':').map(Number),e=E[ei];if(!e||!(pr[e.n]>=.999))return null;
  const o=hh?e.b:e.a,p=o.p,k=p.w.length,dirL=$('sd').value==='L';
  if(k<2)return null;
  const nb=(o.i+(dirL?-1:1)+k)%k;
  const ex=E.find(q=>(q.a.p===p&&q.a.i===nb)||(q.b.p===p&&q.b.i===nb));
  if(!ex||ex===e||!(pr[ex.n]>=.999))return null;
  const hx=ex.a.p===p&&ex.a.i===nb?0:1,ox=hx?ex.b:ex.a,oy=hx?ex.a:ex.b,q=oy.p,cx=curve(ex);
  const S0=sp(p,o.s),A1=sp(p,ox.s),B1=sp(q,oy.s),kq=q.w.length,mq=q.m;
  const tw=!!TW[ex.n],before=dirL!==tw;
  const a1B=q.rot+2*PI*oy.s/mq,nbq=(oy.i+(before?-1:1)+kq)%kq,aN=q.rot+2*PI*q.pos[nbq]/mq;
  let gap=(before?(a1B-aN):(aN-a1B))%(2*PI);if(gap<=1e-9)gap+=2*PI;
  const aT=a1B+(before?-1:1)*Math.min(4*PI/mq,gap/2),R0=rad(q)*Math.cos(PI/mq);
  const nT=[Math.cos(aT),-Math.sin(aT)],T=[q.c[0]+R0*nT[0],q.c[1]+R0*nT[1]];
  const kk=u=>.5*u;
  const d1=Math.hypot(S0.x-A1.x,S0.y-A1.y),d4=Math.hypot(B1.x-T[0],B1.y-T[1]);
